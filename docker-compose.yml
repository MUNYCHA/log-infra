services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
      # Custom "logstream" login theme (built from ./keycloak-theme via `npm run build-keycloak-theme`).
      # KC 26 falls outside Keycloakify's 22-to-25 range, so use the all-other-versions jar.
      - ./keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/logstream-theme.jar:ro
    ports:
      - "9090:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - monitoring

  nginx:
    build:
      context: ../log-dashboard-ui
      dockerfile: Dockerfile
      args:
        # WS/SSO URLs default to same-origin at runtime (see UI src/config.js);
        # leave VITE_WS_URL / VITE_SSO_LOGIN_URL blank for the standard proxied deploy.
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_MAX_LOGS_PER_TOPIC: ${VITE_MAX_LOGS_PER_TOPIC:-500}
        VITE_MAX_MESSAGE_LENGTH: ${VITE_MAX_MESSAGE_LENGTH:-50000}
        VITE_SSO_LOGIN_URL: ${VITE_SSO_LOGIN_URL:-}
        VITE_SSO_CLIENT_ID: ${VITE_SSO_CLIENT_ID}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keycloak
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

volumes:
  keycloak_data:

networks:
  monitoring:
    external: true
