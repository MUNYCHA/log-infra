services:
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME} -d ${KC_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start --import-realm
    environment:
      APP_ORIGIN: ${APP_ORIGIN}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${APP_ORIGIN}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Custom "logstream" login theme (built from ./keycloak-theme via `npm run build-keycloak-theme`).
      # KC 26 falls outside Keycloakify's 22-to-25 range, so use the all-other-versions jar.
      - ./keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/logstream-theme.jar:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app

  logstream:
    build:
      context: ../logstream
      dockerfile: Dockerfile
    expose:
      - "8080"
    volumes:
      - ${LOGSTREAM_LOG_DIR}:${LOGSTREAM_LOG_DIR}:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-log-dashboard}
      KAFKA_MAX_POLL_RECORDS: ${KAFKA_MAX_POLL_RECORDS:-500}
      LOGSTREAM_TOPICS: ${LOGSTREAM_TOPICS}
      LOGSTREAM_ALLOWED_ORIGINS: ${APP_ORIGIN}
      LOGSTREAM_LOG_DIR: ${LOGSTREAM_LOG_DIR}
      JVM_MAX_HEAP: ${JVM_MAX_HEAP:-512m}
      SSO_JWKS_URI: http://keycloak:8080/auth/realms/logstream/protocol/openid-connect/certs
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_ORG_MUNYCHA_LOGSTREAM: INFO
    depends_on:
      - keycloak
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "2.0"
        reservations:
          memory: 384m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - app
      - monitoring

  nginx:
    build:
      context: ../log-dashboard-ui
      dockerfile: Dockerfile
      args:
        # WS/SSO URLs default to same-origin at runtime (see UI src/config.js);
        # leave VITE_WS_URL / VITE_SSO_LOGIN_URL blank for the standard proxied deploy.
        VITE_WS_URL: ""
        VITE_MAX_LOGS_PER_TOPIC: ${VITE_MAX_LOGS_PER_TOPIC:-500}
        VITE_MAX_MESSAGE_LENGTH: ${VITE_MAX_MESSAGE_LENGTH:-50000}
        VITE_SSO_LOGIN_URL: ""
        VITE_SSO_CLIENT_ID: ${VITE_SSO_CLIENT_ID}
    ports:
      # Public HTTPS port. Defaults to 443; override with HTTPS_PORT in .env if
      # 443 is unavailable. nginx still listens on 443 inside the container — only
      # the host-published port changes. If you set a non-443 port, it must also
      # appear in APP_ORIGIN (see .env.example).
      - "${HTTPS_PORT:-443}:443"
      # Port 80 redirects to HTTPS, but only lands correctly on the standard 443.
      # With a custom HTTPS_PORT, this redirect targets 443 (dead) — see .env.example.
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS cert + key the lead installs at deploy time (see certs/README.md).
      # nginx will not start if certs/fullchain.pem and certs/privkey.pem are missing.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
      - logstream
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

volumes:
  keycloak_db_data:

networks:
  app:
  monitoring:
    external: true
