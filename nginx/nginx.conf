# Safe access log format: uses $uri (path only, no query string). The current
# WebSocket client carries its token as a subprotocol header, and this also keeps
# future query data out of the access log. Use this everywhere; never log $request.
log_format ws_safe '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log ws_safe;

    # use Docker's internal DNS — resolves upstream hostnames at request time, not startup
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # serve React UI
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Strict CSP for the SPA. Everything is same-origin (API, WS, Keycloak
        # are all proxied under this host), so 'self' covers connect/ws/frame.
        # frame-src 'self' is needed for oidc-client-ts silent-renew iframe (/auth/...).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # cache hashed static assets (JS/CSS bundles — Vite adds content hash to filenames)
    location ~* \.(js|css|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # proxy REST API to logstream
    location /api {
        set $upstream http://logstream:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # proxy WebSocket to logstream API
    location /ws {
        set $upstream http://logstream:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Pass the subprotocol header through unmodified — it carries the bearer token
        # the JwtHandshakeInterceptor reads at handshake.
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # proxy Keycloak OIDC and administrator endpoints
    # ^~ prevents the \.css|\.js regex above from intercepting Keycloak's theme assets.
    # Keycloak emits its own CSP/headers for the login pages — do not override here.
    location ^~ /auth/ {
        set $keycloak_upstream http://keycloak:8080;
        proxy_pass $keycloak_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
